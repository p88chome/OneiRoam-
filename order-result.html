<!DOCTYPE html>
<html lang="zh-TW"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
  <meta name="robots" content="noindex">
  <title>OneiRoaM — 付款結果</title>
  <link rel="stylesheet" href="style.css">
</head><body data-lang="zh">
  <main class="order-page"><div class="container result-box">
    <p class="success-mark">✦</p>
    <h2 id="resultTitle">付款處理中</h2>
    <p id="orderNoLine" data-hide>訂單編號：<strong id="orderNo"></strong></p>
    <p id="resultMsg">我們已收到 PAYUNi 的付款結果，訂單狀態將於確認後更新。</p>
    <div id="payInfo" class="pay-info" data-hide>
      <p id="payBankLine" data-hide>銀行代碼：<strong id="payBank"></strong></p>
      <p><span id="payNoLabel">轉帳帳號</span>：<strong id="payNo" class="pay-no"></strong></p>
      <p>應付金額：NT$ <strong id="payAmt"></strong></p>
      <p>繳費期限：<strong id="payExpire"></strong></p>
      <p class="pay-hint">請截圖或抄下以上資訊；逾期未繳訂單將自動取消。</p>
    </div>
    <p>請留意品牌 IG 及 LINE 通知。</p>
    <a href="index.html" class="btn-primary">返回首頁</a>
  </div></main>
  <script src="order-result.js"></script>
</body></html>
