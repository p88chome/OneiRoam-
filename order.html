<!DOCTYPE html>
<html lang="zh-TW" data-theme="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OneiRoam 夢遊 — 訂購頁">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://sandbox-api.payuni.com.tw https://api.payuni.com.tw">
  <title>OneiRoam — 訂購</title>
  <link rel="canonical" href="https://www.oneiroam.com/order.html">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-lang="zh">
  <header id="header" class="scrolled">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <span class="logo-brand">OneiRoam</span>
        <span class="logo-sub" data-zh="夢遊" data-en="Wander Through Dreams">夢遊</span>
      </a>
      <nav id="main-nav">
        <a href="index.html#collections" data-zh="繼續逛" data-en="Keep Shopping">繼續逛</a>
      </nav>
      <a href="member.html" class="member-link" aria-label="會員專區">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="22" height="22">
          <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>
        </svg>
      </a>
      <button class="lang-toggle" id="langToggle" aria-label="語言切換">
        <span class="l-zh active">中</span><span class="l-div">|</span><span class="l-en">EN</span>
      </button>
    </div>
  </header>

  <main class="order-page">
    <div class="container">
      <div class="section-header">
        <p class="section-label" data-zh="訂單確認" data-en="Your Order">訂單確認</p>
        <h2 data-zh="完成妳的夢境訂購" data-en="Complete Your Order">完成妳的夢境訂購</h2>
      </div>

      <div id="cartEmpty" class="cart-empty" style="display:none">
        <p data-zh="訂單是空的" data-en="Your order is empty">訂單是空的</p>
        <a href="index.html#collections" class="btn-primary" data-zh="去逛逛" data-en="Browse Collections">去逛逛</a>
      </div>

      <div id="cartArea">
        <div id="cartList" class="cart-list"></div>
        <div class="cart-summary">
          <div class="sum-row"><span data-zh="小計" data-en="Subtotal">小計</span>
            <span>NT$ <span id="sumSubtotal">0</span></span></div>
          <div class="sum-row" id="sumDiscountRow"><span data-zh="折扣" data-en="Discount">折扣</span>
            <span>− NT$ <span id="sumDiscount">0</span></span></div>
          <div class="sum-row sum-total"><span data-zh="合計" data-en="Total">合計</span>
            <span>NT$ <span id="sumTotal">0</span></span></div>
        </div>

        <form id="orderForm" class="order-form" novalidate>
          <h3 data-zh="訂購人資訊" data-en="Your Info">訂購人資訊</h3>
          <div id="memberBox" class="member-box">
            <button type="button" id="googleLoginBtn" class="btn-google">
              <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
              <span data-zh="用 Google 登入，自動帶入資料" data-en="Sign in with Google to autofill">用 Google 登入，自動帶入資料</span>
            </button>
            <p id="memberInfo" class="member-info" style="display:none">
              <span data-zh="已登入" data-en="Signed in as">已登入</span>
              <span id="memberEmail"></span>
              <button type="button" id="logoutBtn" class="btn-logout" data-zh="登出" data-en="Sign out">登出</button>
            </p>
          </div>
          <label><span data-zh="姓名" data-en="Name">姓名</span>
            <input name="name" type="text" required maxlength="60"></label>
          <label><span data-zh="Line名稱或IG帳號" data-en="LINE name or IG account">Line名稱或IG帳號</span>
            <input name="social" type="text" maxlength="60"></label>
          <label><span data-zh="Email（收訂單確認信）" data-en="Email (order confirmation)">Email（收訂單確認信）</span>
            <input name="email" type="email" required maxlength="120"></label>
          <label><span data-zh="備註" data-en="Notes">備註</span>
            <textarea name="notes" maxlength="500"></textarea></label>
          <p id="preorderGate" class="preorder-gate" style="display:none"></p>
          <button type="submit" id="submitBtn" class="btn-primary"
                  data-zh="送出訂單" data-en="Place Order">送出訂單</button>
          <p id="formError" class="form-error" style="display:none"></p>
        </form>
      </div>

    </div>
  </main>

  <footer id="footer">
    <div class="footer-inner">
      <p class="footer-copy" data-zh="© 2026 OneiRoam. 保留所有權利。" data-en="© 2026 OneiRoam. All rights reserved.">© 2026 OneiRoam. 保留所有權利。</p>
    </div>
  </footer>

  <script src="cart.js"></script>
  <script src="admin.config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="order.js"></script>
</body>
</html>
